name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up bootstrap Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install nox
        run: python -m pip install "nox[pbs]>=2024.10,<2026.0"

      - name: Run lint
        run: nox -s lint

  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python 3.10
            runner: ubuntu-latest
            python_version: "3.10"
            nox_session: compat-3.10
          - name: Python 3.11
            runner: ubuntu-latest
            python_version: "3.11"
            nox_session: compat-3.11
          - name: Python 3.12
            runner: ubuntu-latest
            python_version: "3.12"
            nox_session: compat-3.12
          - name: Python 3.14
            runner: ubuntu-latest
            python_version: "3.14"
            nox_session: compat-3.14
          - name: Platform Linux x64
            runner: ubuntu-24.04
            python_version: "3.13"
            nox_session: unit
            platform_id: linux-x64
            go_tests: true
          - name: Platform Linux arm64
            runner: ubuntu-24.04-arm
            python_version: "3.13"
            nox_session: unit
            platform_id: linux-arm64
            go_tests: true
          - name: Platform macOS x64
            runner: macos-15-intel
            python_version: "3.13"
            nox_session: unit
            platform_id: macos-x64
            go_tests: true
          - name: Platform macOS arm64
            runner: macos-15
            python_version: "3.13"
            nox_session: unit
            platform_id: macos-arm64
            go_tests: true
          - name: Platform Windows x64
            runner: windows-2025
            python_version: "3.13"
            nox_session: unit
            platform_id: windows-x64
            go_tests: true
          - name: Platform Windows arm64
            runner: windows-11-arm
            python_version: "3.13"
            nox_session: unit
            platform_id: windows-arm64
            go_tests: true

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip

      - name: Set up Go
        if: ${{ matrix.go_tests == true }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: client/go-cli/go.mod

      - name: Cache Go client smoke binary
        if: ${{ matrix.go_tests == true }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ci/go-client-smoke
          key: go-client-smoke-${{ matrix.platform_id }}-${{ hashFiles('client/go-cli/**', 'tools/build_go_client') }}

      - name: Install nox
        run: python -m pip install "nox[pbs]>=2024.10,<2026.0"

      - name: Set up OpenSSL for Windows arm64 Python dependencies
        if: ${{ matrix.platform_id == 'windows-arm64' }}
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone https://github.com/microsoft/vcpkg $vcpkgRoot
          & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          & (Join-Path $vcpkgRoot "vcpkg.exe") install openssl:arm64-windows-static-md
          $opensslRoot = Join-Path $vcpkgRoot "installed\arm64-windows-static-md"
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_DIR=$opensslRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run Go client tests
        if: ${{ matrix.go_tests == true }}
        working-directory: client/go-cli
        env:
          GOCACHE: ${{ runner.temp }}/go-build
        run: |
          go test ./...
          go test -count=1 -v -run '^TestEnrollmentTerminal(PTY|Windows)$' ./internal/cli

      - name: Run Python compatibility unit suite
        if: ${{ matrix.go_tests != true }}
        run: nox -s ${{ matrix.nox_session }}

      - name: Run platform unit test suite
        if: ${{ matrix.go_tests == true }}
        env:
          ARBITER_GO_CLIENT_SMOKE_OUTDIR: .ci/go-client-smoke
          ARBITER_GO_CLIENT_SMOKE_REUSE: "1"
          GOCACHE: ${{ runner.temp }}/go-build
        run: nox -s ${{ matrix.nox_session }}

      - name: Verify fresh Python-Go credential interoperability
        if: ${{ matrix.go_tests == true }}
        env:
          GOCACHE: ${{ runner.temp }}/go-build
        run: nox -s unit -- server/tests/integration/test_credential_peer.py server/tests/integration/test_provisional_peer.py server/tests/integration/test_pairing_peer.py server/tests/integration/test_enrollment_cli_peer.py server/tests/integration/test_control_tls_peer.py server/tests/integration/test_enrollment_receipt_peer.py

      - name: Verify native local-control rejection across OS users
        if: ${{ startsWith(matrix.platform_id, 'linux-') || startsWith(matrix.platform_id, 'macos-') }}
        run: sudo .nox/unit/bin/python -m pytest server/tests/unit/test_local_control.py::test_real_different_os_user_is_rejected -q

  website:
    name: Website
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm install --global npm@11.9.0 && npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website/build

  deploy-website:
    name: Deploy website
    runs-on: ubuntu-latest
    needs:
      - lint
      - tests
      - website
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
