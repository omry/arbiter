blueprint:
  schema: 1
  version: 0.1.0
  requires_reploy: ">=0.4.6.dev1"

app:
  id: arbiter
  provider:
    type: python
    identifier: arbiter-server
    local_sources:
      arbiter-client: ../../../../client
      arbiter-imap: ../../../../plugins/imap
      arbiter-server: ../../../../server
      arbiter-smtp: ../../../../plugins/smtp
      arbiter-suite: ../../../../meta/arbiter-suite
  terminal:
    color_env: ARBITER_COLOR

install:
  target:
    default_path: /opt/{{ app.id }}
  owner:
    user: arbiter
    group: arbiter
  ports:
    deployed:
      https:
        host_bind: 127.0.0.1
        host_port: 8075
        container_port: 8075
    staging:
      https:
        host_bind: 127.0.0.1
        host_port: 18075
        container_port: 8075
  managed_paths:
    files:
      - path: .arbiter.env
        update: preserve
        mount: /{{ path }}
    dirs:
      - path: conf
        update: preserve
        mount: /{{ path }}
      - path: data
        update: preserve
        mount: /{{ path }}
        runtime_readonly: false

bundle:
  options:
    arbiter-suite:
      identifier: arbiter-suite
      group: meta
      description: Install the full Arbiter suite.
    imap:
      identifier: arbiter-imap
      group: plugins
      description: Receive email through IMAP.
    smtp:
      identifier: arbiter-smtp
      group: plugins
      description: Send email through SMTP.

docker:
  deployment_dirs:
    config: conf
    bundle: .reploy/bundle
    data: data
  install:
    success:
      vars:
        server_url:
          server_url: true
      lines:
        - "server url: ${server_url}"
        - "client command: arbiter arbiter.url=${server_url} info server"
    hooks:
      before_start:
        - app: [config, check]
      after_start:
        - health_check:
            wait: true
        - app: [config, check, --live]
  service:
    image: python:3.11-slim
    container_host: 0.0.0.0
  environment:
    ARBITER_CONFIG_NAME: arbiter-server
  runtime:
    overrides:
      - arbiter.server.bind.host=${REPLOY_CONTAINER_HOST}
      - arbiter.server.bind.port=${REPLOY_CONTAINER_PORT}
      - arbiter.server.public.scheme=${REPLOY_PUBLIC_SCHEME}
      - arbiter.server.public.host=${REPLOY_PUBLIC_HOST}
      - arbiter.server.public.port=${REPLOY_HOST_PORT}
      - arbiter.storage.server_data_dir=/data/server
      - arbiter.storage.plugin_data_dir=/data/plugins
      - arbiter.deployment_scope=staged
    optional_env_overrides:
      REPLOY_PUBLIC_BASE_URL: arbiter.server.public.base_url
  health:
    scheme_env: REPLOY_PUBLIC_SCHEME
    host_env: REPLOY_HOST_BIND
    port_env: REPLOY_HOST_PORT
    default_scheme: https
    default_host: 127.0.0.1
    default_port: "18075"
    path: /_health_
    tls_verify: false
  default_command: serve
  command_defaults:
    app_command: true
    deployed_command: true
    container:
      argv_prefix:
        - arbiter-server
        - --config-dir
        - /conf
        - --config-name
        - ${ARBITER_CONFIG_NAME}
  commands:
    serve:
      container:
        argv_suffix:
          - serve
    config_check:
      trigger:
        - config
        - check
      forward_flags:
        - --live
      container:
        argv_suffix:
          - config
          - check
    bootstrap_server:
      trigger:
        - bootstrap
        - server
      deployed_command: false
      forward_flags:
        - --force
      container:
        argv_suffix:
          - bootstrap
          - --server
    bootstrap:
      trigger:
        - bootstrap
      deployed_command: false
      forward_args: true
      container:
        argv_suffix:
          - bootstrap
    config_activate:
      trigger:
        - config
        - activate
      forward_args: true
      container:
        argv_suffix:
          - config
          - activate
    config_deactivate:
      trigger:
        - config
        - deactivate
      forward_args: true
      container:
        argv_suffix:
          - config
          - deactivate
    config_show:
      trigger:
        - config
        - show
      forward_args: true
      container:
        argv_suffix:
          - config
          - show
    env_bootstrap:
      trigger:
        - env
        - bootstrap
      deployed_command: false
      forward_args: true
      container:
        argv_suffix:
          - env
          - bootstrap
    env_check:
      trigger:
        - env
        - check
      forward_args: true
      container:
        argv_suffix:
          - env
          - check
    version:
      trigger:
        - version
      forward_flags:
        - --json
      container:
        argv_suffix:
          - version
    plugins_list:
      trigger:
        - plugins
        - list
      forward_flags:
        - --json
      container:
        argv_suffix:
          - plugins
          - list
